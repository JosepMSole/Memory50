<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DARK LIMITS – Puzzles (v2.1)</title>
  <link rel="icon" type="image/x-icon" href="ICO.ico" />

  <style>
    :root{
      --text:#e8ecff;
      --muted:#a9b4ff;
      --panel: rgba(10,14,28,0.62);
      --panel2: rgba(10,14,28,0.40);
      --stroke: rgba(255,255,255,0.14);
      --accent: #6aa7ff;
      --good: #33d17a;
      --warn: #ffd166;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      overflow:hidden;
      background:#050812;
    }

    /* ===== Intro (mandatory) ===== */
/* ===== Pre-start gate (v1.2) ===== */
.preStart{
  position:fixed; inset:0;
  z-index:100000;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}
.preStart.hidden{ display:none; }
.preStartInner{
  width:min(420px, 82vw);
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:stretch;
  justify-content:center;
}
.preStartIco{
  width:100%;
  height:auto;
  display:block;
  image-rendering:auto;
}
.preStartBtn{
  width:100%;
  appearance:none;
  border:none;
  background:#ff4fa3;
  color:#000;
  padding:16px 18px;
  border-radius:18px;
  cursor:pointer;
  font-weight:900;
  letter-spacing:.6px;
  font-size:18px;
  box-shadow: 0 16px 50px rgba(0,0,0,0.55);
}
.preStartBtn:active{ transform: translateY(1px); }

/* ===== Desktop-only lock (v1.2) ===== */
.mobileBlockImg{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#000;
}

/* ===== Centered modal window helper (v1.2) ===== */
.window.centerModal{
  position:fixed !important;
  left:50% !important;
  top:50% !important;
  transform: translate(-50%, -50%) !important;
  margin:0 !important;
}
    .overlayFull{
      position:fixed; inset:0;
      z-index:99999;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .overlayFull.hidden{ display:none; }
    .overlayFull video, .overlayFull img{
      width:100%; height:100%;
      object-fit:cover;
      display:block;
    }
    .introImgZoom{
      transform:scale(1);
      animation: introZoom 2s ease-in-out forwards;
    }
    @keyframes introZoom{
      0%{ transform:scale(1); }
      100%{ transform:scale(1.08); }
    }
    .startGate{
      position:absolute; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      z-index:1;
    }
    .startGate.on{ display:flex; }
    .startBtn{
      appearance:none;
      border:1px solid rgba(255,255,255,0.22);
      background: rgba(17,26,51,0.70);
      color:var(--text);
      padding:14px 16px;
      border-radius:16px;
      cursor:pointer;
      font-weight:900;
      letter-spacing:.2px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }

    /* ===== Post-level full video ===== */
    .postOverlay{
      position:fixed; inset:0;
      z-index:99998;
      background:#000;
      display:none;
    }
    .postOverlay.on{ display:block; }
    .postOverlay video{ width:100%; height:100%; object-fit:cover; }

    /* ===== Background video ===== */
    .bg{
      position:fixed;
      inset:0;
      z-index:-2;
      overflow:hidden;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(106,167,255,0.18), rgba(0,0,0,0) 60%),
        radial-gradient(1200px 800px at 50% 110%, rgba(255,255,255,0.06), rgba(0,0,0,0) 55%),
        #050812;
    }
    .bg video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:1;
      filter: saturate(0.95) contrast(1.05);
    }

    /* ===== Screens ===== */
    .screen{
      position:relative;
      min-height:100vh;
      display:none;
      padding:18px;
    }
    .screen.on{ display:block; }

    /* ===== Stage ===== */
    .stage{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:auto;
    }

    /* ===== Board ===== */
    .board{
      position:absolute;
      width:min(760px, 100%);
      aspect-ratio: 1 / 1;
      border-radius:18px;
      overflow:hidden;
      background: rgba(0,0,0,0.22);
      border:1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
      pointer-events:none;
    }
    .boardGlow{
      position:absolute;
      inset:0;
      pointer-events:none;
      background: radial-gradient(800px 500px at 50% 0%, rgba(106,167,255,0.18), transparent 60%);
    }

    /* ===== Pieces ===== */
    .piece{
      position:absolute;
      touch-action:none;
      cursor:grab;
      user-select:none;
      will-change:left, top, transform, filter;
      transition: filter .12s ease;
      filter:
        drop-shadow(0 10px 18px rgba(0,0,0,0.35))
        drop-shadow(0 0 6px rgba(255,255,255,0.22))
        drop-shadow(0 0 18px rgba(183,224,255,0.45))
        drop-shadow(0 0 44px rgba(119,178,255,0.55));
    }
    .piece:active{ cursor:grabbing; }
    .piece.locked{
      cursor:default;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.28));
    }
    .piece canvas{ display:block; background: transparent; }

    /* ===== Windows ===== */
    .windows{
      position:fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
    }
    .window{
      position:absolute;
      max-width: calc(100vw - 24px);
      border-radius:18px;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      overflow:hidden;
      backdrop-filter: blur(10px);
      pointer-events:auto;
    }
    .windowHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:9px 10px;
      border-bottom:1px solid rgba(255,255,255,0.10);
      cursor:grab;
      user-select:none;
      background: rgba(0,0,0,0.12);
    }
    .windowHeader:active{ cursor:grabbing; }
    .windowTitle{
      font-weight:900;
      letter-spacing:.2px;
      font-size:13px;
      color:rgba(232,236,255,0.95);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .windowBody{ padding:12px; }

    .window.collapsed .windowBody{ display:none; }


    .closeBtn{
      width:28px; height:28px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(17,26,51,0.55);
      color:var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-weight:900;
      line-height:1;
      transition:.15s ease;
      flex:0 0 auto;
    }

    h2{ margin:0; font-size:16px; letter-spacing:0.2px; }
    p{ margin:10px 0; color:var(--muted); line-height:1.35; font-size:14px; }
    .small{ font-size:12px; color:var(--muted); }

    .btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    button, a.btnlink{
      appearance:none;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(17,26,51,0.55);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:900;
      letter-spacing:.15px;
      transition:.15s ease;
      user-select:none;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .primary{
      background: linear-gradient(180deg, rgba(106,167,255,0.40), rgba(106,167,255,0.14));
      border-color: rgba(106,167,255,0.60);
    }

    .toast{
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.14);
      font-size:13px;
      color:var(--muted);
      display:none;
    }
    .toast.warn{ border-color: rgba(255,209,102,0.55); color: rgba(255,209,102,0.95); display:block; }

    /* ===== Menu ===== */
    .menuFooter{ text-align:center; }
    .pillLink{
      display:inline-block;
      padding:2px 10px;
      border-radius:999px;
      background: rgba(255,255,255,0.92);
      color:#000 !important;
      text-decoration:none;
      font-weight:900;
      letter-spacing:.25px;
    }
        .menuTextBig{
      font-size: 18px;
      line-height: 1.25;
      color: rgba(232,236,255,0.96);
      font-weight: 400;
      letter-spacing: .2px;
      text-align:center;
    }

    
    to{ width:60ch; }
    }
    /* ===== Controls compact + stats emphasized ===== */
    .controlsCompact .windowBody{ padding:10px; }
    .controlsCompact .miniTitle{
      font-weight:900;
      font-size: clamp(20px, 9vw, 34px);
      letter-spacing:.6px;
      text-align:center;
      width:100%;
      line-height:1.05;
    }
    .controlsCompact .miniDesc{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
      text-align:center;
      width:100%;
    }
    .controlsCompact button{ padding:8px 10px; font-size:12px; }
    .controlsCompact .btns{
      gap:6px;
      margin-top:8px;
      justify-content:center;
    }
    .audioRow{
      margin-top:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      padding:8px 10px;
      border-radius:14px;
      background: rgba(0,0,0,0.18);
      border:1px solid rgba(255,255,255,0.10);
    }
    .audioRow label{
      font-size:11px;
      color:var(--muted);
      font-weight:900;
      letter-spacing:.2px;
    }
    .audioRow input[type="range"]{ width:110px; }

    .statsBig{
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      background: rgba(0,0,0,0.18);
      border:1px solid rgba(255,255,255,0.10);
      display:grid;
      gap:8px;
    }
    .statsBig .row{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
      color: rgba(232,236,255,0.92);
      font-weight:900;
      letter-spacing:.2px;
      font-size:15px;
    }
    .statsBig .row b{
      color: var(--text);
      font-weight:900;
      font-size:20px;
      letter-spacing:.2px;
    }

    
    /* ===== Completion FX (restaurado v0.3) ===== */
    @keyframes warpPulse {
      0%{transform:scale(1); opacity:.85; filter:blur(0px);}
      20%{transform:scale(1.06); opacity:1; filter:blur(.5px);}
      45%{transform:scale(1.02); opacity:1; filter:blur(0px);}
      70%{transform:scale(1.08); opacity:1; filter:blur(.6px);}
      100%{transform:scale(1); opacity:.9; filter:blur(0px);}
    }
    @keyframes pieceHyper {
      0%{transform:translate(0,0) rotate(0) scale(1);}
      10%{transform:translate(8px,-18px) rotate(7deg) scale(1.12);}
      22%{transform:translate(-18px,14px) rotate(-10deg) scale(1.06);}
      36%{transform:translate(20px,10px) rotate(11deg) scale(1.14);}
      55%{transform:translate(-12px,-16px) rotate(-9deg) scale(1.08);}
      76%{transform:translate(10px,6px) rotate(7deg) scale(1.10);}
      100%{transform:translate(0,0) rotate(0) scale(1);}
    }
    @keyframes glowStrobe {
      0%{filter:
          drop-shadow(0 10px 18px rgba(0,0,0,0.35))
          drop-shadow(0 0 10px rgba(255,255,255,0.22))
          drop-shadow(0 0 38px rgba(183,224,255,0.45))
          drop-shadow(0 0 120px rgba(119,178,255,0.55));}
      50%{filter:
          drop-shadow(0 10px 18px rgba(0,0,0,0.35))
          drop-shadow(0 0 22px rgba(255,255,255,0.40))
          drop-shadow(0 0 88px rgba(183,224,255,0.80))
          drop-shadow(0 0 260px rgba(119,178,255,0.80));}
      100%{filter:
          drop-shadow(0 10px 18px rgba(0,0,0,0.35))
          drop-shadow(0 0 10px rgba(255,255,255,0.22))
          drop-shadow(0 0 38px rgba(183,224,255,0.45))
          drop-shadow(0 0 120px rgba(119,178,255,0.55));}
    }
    @keyframes shimmer { 0%{opacity:1;} 50%{opacity:.90;} 100%{opacity:1;} }
    .celebrate .boardGlow{ animation:warpPulse 2s ease-in-out both; opacity:1; }
    .celebrate .piece{
      animation: pieceHyper 2s cubic-bezier(.18,.95,.12,1) both, glowStrobe .18s ease-in-out infinite, shimmer .16s ease-in-out infinite;
    }

/* ===== Completion FX overlay flash ===== */
    .fxFlash{
      position:absolute;
      inset:-20%;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.55), rgba(119,178,255,0.36) 35%, rgba(0,0,0,0) 72%),
        radial-gradient(closest-side at 28% 58%, rgba(183,224,255,0.28), rgba(0,0,0,0) 65%),
        radial-gradient(closest-side at 72% 40%, rgba(119,178,255,0.26), rgba(0,0,0,0) 65%);
      mix-blend-mode: screen;
      filter: blur(6px);
      z-index: 1;
    }
    @keyframes flashPop{
      0%{opacity:0; transform:scale(.98);}
      8%{opacity:1; transform:scale(1.02);}
      22%{opacity:.35; transform:scale(1.06);}
      40%{opacity:.98; transform:scale(1.03);}
      70%{opacity:.20; transform:scale(1.08);}
      100%{opacity:0; transform:scale(1.10);}
    }
    .celebrate .fxFlash{ animation:flashPop 2s ease-in-out both; }
    .stage.disabled{ pointer-events:none; }

    /* ===== Completion window ===== */
    .completeWrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:6px 0;
    }
    .completeImg{
      width:min(360px, 70vw);
      height:auto;
      display:block;
    }
    .completeLine{
      margin-top:10px;
      color:var(--muted);
      font-size:16px;
      font-weight:900;
      text-align:center;
    }

    @media (max-width: 520px){
      .menuTextBig{ font-size:16px; font-weight:400; }
      .audioRow input[type="range"]{ width:92px; }
      .statsBig .row{ font-size:14px; }
      .statsBig .row b{ font-size:18px; }
    }


    /* ============================================================
       DARK LIMITS PUZZLES v2.1 — SCI-FI UI / DESKTOP
       ============================================================ */
    :root{
      --dl-cyan:#69f6ff;
      --dl-cyan2:#19b8d6;
      --dl-blue:#176dff;
      --dl-mag:#ff3db7;
      --dl-green:#5cffb0;
      --dl-red:#ff4868;
      --dl-ink:#02070e;
      --dl-panel:rgba(2,9,18,.90);
      --dl-panel2:rgba(4,18,31,.82);
      --dl-line:rgba(105,246,255,.38);
      --dockW:300px;
    }
    body{
      font-family:"Arial Narrow", "Roboto Condensed", ui-sans-serif, system-ui, sans-serif;
      background:#01050a;
      letter-spacing:.02em;
    }
    body::after{
      content:"";
      position:fixed; inset:0; pointer-events:none; z-index:99990;
      background:repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px);
      opacity:.32;
      mix-blend-mode:screen;
    }
    .bg{ background:#02060c; }
    .bg video{ opacity:.56; filter:saturate(.62) contrast(1.16) brightness(.72); }
    .bg::before,
    .bg::after{
      content:""; position:absolute; inset:-20%; pointer-events:none;
      will-change:transform,opacity;
    }
    .bg::before{
      background:linear-gradient(105deg, transparent 35%, rgba(60,230,255,.055) 48%, rgba(255,61,183,.035) 52%, transparent 64%);
      animation:bgSweep 13s linear infinite;
    }
    .bg::after{
      background:radial-gradient(circle at 50% 50%, transparent 0 42%, rgba(25,184,214,.07) 72%, rgba(0,0,0,.32) 100%);
      animation:bgBreath 6s ease-in-out infinite;
    }
    @keyframes bgSweep{from{transform:translate3d(-16%,0,0)}to{transform:translate3d(16%,0,0)}}
    @keyframes bgBreath{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.85;transform:scale(1.025)}}

    .preStart{background:radial-gradient(circle at 50% 40%, #081522 0, #010306 62%);}
    .preStartInner{width:min(430px,82vw);padding:26px;border:1px solid var(--dl-line);background:linear-gradient(180deg,rgba(5,20,34,.78),rgba(0,4,9,.92));clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 0 0 1px rgba(105,246,255,.08) inset,0 0 55px rgba(25,184,214,.12);animation:panelPulse 4s ease-in-out infinite;}
    .preStartBtn,.startBtn{border-radius:2px;border:1px solid rgba(105,246,255,.72);background:linear-gradient(90deg,rgba(23,109,255,.22),rgba(105,246,255,.13));color:#dffcff;text-transform:uppercase;letter-spacing:.2em;box-shadow:0 0 22px rgba(105,246,255,.12) inset,0 0 26px rgba(25,184,214,.12);position:relative;overflow:hidden;}
    .preStartBtn:hover,.startBtn:hover{border-color:var(--dl-cyan);text-shadow:0 0 10px var(--dl-cyan);}

    .introSkipHint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;padding:8px 14px;border:1px solid rgba(105,246,255,.45);background:rgba(0,8,15,.72);color:#c8fbff;font-size:11px;font-weight:900;letter-spacing:.18em;pointer-events:none;animation:skipPulse 1.5s ease-in-out infinite;}
    @keyframes skipPulse{0%,100%{opacity:.38}50%{opacity:1}}

    .window{
      border-radius:3px;
      border:1px solid var(--dl-line);
      background:linear-gradient(145deg,var(--dl-panel),var(--dl-panel2));
      box-shadow:0 0 0 1px rgba(105,246,255,.07) inset,0 18px 60px rgba(0,0,0,.56),0 0 30px rgba(25,184,214,.10);
      backdrop-filter:blur(12px);
      clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
      animation:panelPulse 4.8s ease-in-out infinite;
    }
    .window::before{content:"";position:absolute;left:-35%;top:0;width:35%;height:1px;background:linear-gradient(90deg,transparent,var(--dl-cyan),transparent);box-shadow:0 0 10px var(--dl-cyan);animation:edgeScan 4.4s linear infinite;pointer-events:none;z-index:10;}
    @keyframes edgeScan{to{left:110%}}
    @keyframes panelPulse{0%,100%{box-shadow:0 0 0 1px rgba(105,246,255,.06) inset,0 18px 60px rgba(0,0,0,.56),0 0 22px rgba(25,184,214,.07)}50%{box-shadow:0 0 0 1px rgba(105,246,255,.14) inset,0 18px 60px rgba(0,0,0,.56),0 0 36px rgba(25,184,214,.16)}}
    .windowHeader{background:linear-gradient(90deg,rgba(23,109,255,.18),rgba(105,246,255,.05));border-bottom:1px solid rgba(105,246,255,.22);text-transform:uppercase;letter-spacing:.15em;}
    .windowTitle{color:#d8fbff;font-size:11px;}
    .windowBody{position:relative;z-index:1;}

    button,a.btnlink,.closeBtn{
      border-radius:2px;
      border:1px solid rgba(105,246,255,.34);
      background:linear-gradient(180deg,rgba(11,35,54,.88),rgba(2,10,18,.92));
      color:#d9fbff;
      text-transform:uppercase;
      letter-spacing:.10em;
      font-size:12px;
      position:relative;
      overflow:hidden;
      box-shadow:0 0 0 1px rgba(105,246,255,.04) inset;
    }
    button::after,a.btnlink::after{content:"";position:absolute;inset:0;transform:translateX(-120%);background:linear-gradient(100deg,transparent,rgba(105,246,255,.16),transparent);transition:transform .38s ease;pointer-events:none;}
    button:hover::after,a.btnlink:hover::after{transform:translateX(120%)}
    button:hover,a.btnlink:hover{border-color:rgba(105,246,255,.92);color:white;box-shadow:0 0 18px rgba(105,246,255,.12),0 0 0 1px rgba(105,246,255,.10) inset;}
    button.primary{background:linear-gradient(90deg,rgba(23,109,255,.32),rgba(25,184,214,.22));border-color:rgba(105,246,255,.72);}

    .menuTextBig{font-size:17px;line-height:1.42;color:rgba(223,249,255,.9);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 14px rgba(105,246,255,.10);}
    .menuFooter{font-size:11px;color:rgba(183,222,231,.56);letter-spacing:.05em;}
    .pillLink{background:transparent!important;color:var(--dl-cyan)!important;border:0!important;padding:0 3px!important;}
    .audioRow,.statsBig,.toast{border-radius:2px;background:rgba(2,11,19,.72);border:1px solid rgba(105,246,255,.18);}
    input[type="range"]{accent-color:var(--dl-cyan);}

    /* Fixed left command deck */
    .controlDock{
      left:0!important;top:0!important;width:var(--dockW)!important;height:100vh!important;
      max-width:none!important;border-top:0;border-bottom:0;border-left:0;border-radius:0!important;
      clip-path:none!important;overflow:auto!important;
      background:linear-gradient(180deg,rgba(1,8,15,.97),rgba(3,16,26,.94));
      box-shadow:8px 0 38px rgba(0,0,0,.46),1px 0 0 rgba(105,246,255,.28)!important;
      animation:none!important;
    }
    .controlDock::before{width:2px;height:32%;left:auto;right:0;top:-35%;background:linear-gradient(180deg,transparent,var(--dl-cyan),transparent);animation:dockScan 4s linear infinite;}
    @keyframes dockScan{to{top:110%}}
    .controlDock .windowBody{padding:18px 16px 22px;display:flex;min-height:100%;flex-direction:column;gap:14px;}
    .hudBrand{font-size:10px;font-weight:900;letter-spacing:.28em;color:rgba(105,246,255,.65);text-align:center;border-bottom:1px solid rgba(105,246,255,.16);padding:4px 0 12px;}
    .controlsCompact .miniTitle{font-size:clamp(24px,2.1vw,34px);color:white;text-transform:uppercase;letter-spacing:.10em;text-shadow:0 0 16px rgba(105,246,255,.30);}
    .controlsCompact .miniDesc{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:rgba(185,228,237,.72);}
    .hudSection{border:1px solid rgba(105,246,255,.16);background:rgba(2,11,19,.54);padding:10px;position:relative;}
    .hudSection::before{content:"";position:absolute;left:0;top:0;width:18px;height:1px;background:var(--dl-cyan);box-shadow:0 0 8px var(--dl-cyan);}
    .hudLabel{font-size:9px;font-weight:900;letter-spacing:.22em;color:rgba(105,246,255,.65);margin-bottom:8px;text-transform:uppercase;}
    .controlDock .btns{display:grid;grid-template-columns:1fr;gap:7px;margin:0;}

    .controlDock .statsBig .row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:68px;border:1px solid rgba(105,246,255,.16);background:rgba(2,11,19,.62);font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:rgba(185,228,237,.65);animation:statPulse 3.2s ease-in-out infinite;}
    .controlDock .statsBig .row:last-child{grid-column:1/-1;min-height:62px;}

    @keyframes statPulse{0%,100%{border-color:rgba(105,246,255,.13)}50%{border-color:rgba(105,246,255,.32)}}
    .hudTip{margin-top:auto;font-size:10px;line-height:1.5;color:rgba(185,228,237,.55);border-top:1px solid rgba(105,246,255,.12);padding-top:10px;text-align:center;}

    .board{border-radius:2px;border:1px solid rgba(105,246,255,.42);background:rgba(0,3,8,.36);box-shadow:0 0 0 1px rgba(105,246,255,.06) inset,0 0 34px rgba(25,184,214,.10);}
    .board::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(105,246,255,.08) 1px,transparent 1px),linear-gradient(rgba(105,246,255,.08) 1px,transparent 1px);background-size:25% 25%;opacity:.18;}
    .piece{filter:drop-shadow(0 8px 13px rgba(0,0,0,.52)) drop-shadow(0 0 9px rgba(105,246,255,.25));}

    /* Reward screen */
    .rewardPanel{position:relative;padding:24px 22px 18px;text-align:center;overflow:hidden;}
    .rewardPanel::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 12deg,rgba(105,246,255,.09) 12deg 15deg,transparent 15deg 35deg,rgba(255,61,183,.06) 35deg 38deg,transparent 38deg 60deg);animation:rewardSpin 12s linear infinite;pointer-events:none;}
    @keyframes rewardSpin{to{transform:rotate(360deg)}}
    .rewardInner{position:relative;z-index:1;}
    .rewardKicker{font-size:10px;font-weight:900;letter-spacing:.32em;color:var(--dl-cyan);text-transform:uppercase;animation:rewardBlink 1.4s ease-in-out infinite;}
    @keyframes rewardBlink{0%,100%{opacity:.5}50%{opacity:1;text-shadow:0 0 12px var(--dl-cyan)}}
    .rewardTitle{margin:8px 0 4px;font-size:clamp(28px,4vw,52px);font-weight:1000;letter-spacing:.08em;color:white;text-transform:uppercase;text-shadow:0 0 26px rgba(105,246,255,.25);}
    .rewardSub{font-size:12px;letter-spacing:.14em;color:rgba(207,244,250,.72);text-transform:uppercase;}
    .rewardPanel .completeImg{width:min(330px,55vw);margin:10px auto 2px;filter:drop-shadow(0 0 22px rgba(105,246,255,.24));animation:rewardImg 2.2s ease-in-out infinite;}
    @keyframes rewardImg{0%,100%{transform:scale(.985)}50%{transform:scale(1.018)}}
    .rewardStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px auto 0;max-width:480px;}
    .rewardStat{border:1px solid rgba(105,246,255,.18);background:rgba(0,7,14,.65);padding:9px 5px;font-size:9px;letter-spacing:.14em;color:rgba(185,228,237,.65);text-transform:uppercase;}
    .rewardStat b{display:block;margin-top:3px;font-size:16px;color:white;letter-spacing:.05em;}

    /* Classified video access */
    .classifiedWrap{min-height:430px;display:grid;place-items:center;position:relative;background:url("assets/thumbnailvideo.jpg") center/cover no-repeat;}

    .classifiedBox{position:relative;z-index:1;width:min(620px,88%);padding:24px;border:1px solid rgba(105,246,255,.35);background:rgba(1,9,17,.85);box-shadow:0 0 45px rgba(25,184,214,.14);text-align:center;}
    .classifiedState{display:inline-block;padding:6px 10px;margin:6px 0 16px;border:1px solid rgba(255,72,104,.55);color:#ff9bad;font-size:10px;font-weight:900;letter-spacing:.2em;animation:skipPulse 1.8s ease-in-out infinite;}
    .classifiedRow{display:grid;grid-template-columns:1fr auto;gap:8px;}
    .classifiedRow input{min-width:0;padding:12px 13px;border:1px solid rgba(105,246,255,.28);background:rgba(0,3,8,.82);color:white;outline:none;text-transform:uppercase;letter-spacing:.12em;}
    .classifiedMsg{min-height:24px;margin-top:10px;font-size:12px;font-weight:900;letter-spacing:.12em;}
    .classifiedVideo{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000;}
    .accessFlash{animation:accessFlash .85s ease-out both;}
    @keyframes accessFlash{0%{box-shadow:0 0 0 rgba(92,255,176,0)}25%{box-shadow:0 0 80px rgba(92,255,176,.85) inset,0 0 60px rgba(92,255,176,.35)}100%{box-shadow:0 0 0 rgba(92,255,176,0)}}

    @media (prefers-reduced-motion:reduce){.window,.window::before,.bg::before,.bg::after,.rewardPanel::before,.rewardKicker,.rewardPanel .completeImg,.controlDock .statsBig .row{animation:none!important}}

  </style>
</head>
<body>

<!-- Pre-start overlay (v2.1) -->
<div id="preStartOverlay" class="preStart" aria-hidden="false">
  <div class="preStartInner">
    <img class="preStartIco" src="ICO.ico" alt="ICO" />
    <button id="preStartBtn" class="preStartBtn" type="button">INICIAR</button>
  </div>
</div>

<!-- Desktop only block (shown if mobile detected after INICIAR) -->
<div id="mobileBlock" class="overlayFull hidden" aria-hidden="true">
  <img class="mobileBlockImg" src="assets/EXCLUSIVO_DESKTOP.jpg" alt="EXCLUSIVO DESKTOP" />
</div>

  <!-- Intro overlay -->
  <div id="introOverlay" class="overlayFull hidden" aria-hidden="true">
    <video id="introVideo" playsinline preload="auto"></video>
    <img id="introImg" alt="Disturbing Games" style="display:none;" />
    <div id="introSkipHint" class="introSkipHint">TOCA PARA OMITIR INTRO</div>
    <div id="startGate" class="startGate" aria-hidden="false">
      <button id="startBtn" class="startBtn" type="button">Toca para comenzar</button>
    </div>
  </div>

  <!-- Post-level overlay -->
  <div id="postOverlay" class="postOverlay" aria-hidden="true">
    <video id="postVideo" playsinline preload="auto"></video>
    <div id="postGate" class="startGate" aria-hidden="false">
      <button id="postBtn" class="startBtn" type="button">Toca para continuar</button>
    </div>
  </div>

  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <video id="bgVideo" muted playsinline preload="metadata"></video>
  </div>

  <!-- Audio -->
  <audio id="bgAudio" loop preload="auto"></audio>
  <audio id="sfxSuccess" preload="auto"></audio>

  <!-- Stage (pieces) -->
  <div id="stage" class="stage" aria-hidden="false" style="display:none;">
    <div id="fxFlash" class="fxFlash" aria-hidden="true"></div>
    <div id="board" class="board" aria-hidden="true">
      <div class="boardGlow"></div>
    </div>
  </div>

  <!-- Windows container -->
  <div id="windows" class="windows"></div>

  <!-- Screens -->
  <section id="screenMenu" class="screen"></section>
  <section id="screenHow" class="screen"></section>
  <section id="screenGame" class="screen"></section>

<script>
(() => {
  // ========= Assets =========
  const ASSETS = "assets/";
  const APP_VERSION = "2.1";
  const IS_EMBEDDED = window.self !== window.top;
  const emitToHost = (type, detail={}) => {
    if (!IS_EMBEDDED) return;
    try { window.parent.postMessage({ source:"DARK_LIMITS_PUZZLES", version:APP_VERSION, type, detail }, "*"); } catch(e) {}
  };

  // ========= Mobile detection =========
  const isMobile = (() => {
    const ua = navigator.userAgent || "";
    const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    return /Mobi|Android|iPhone|iPad|iPod/i.test(ua) || coarse;
  })();

  // ========= Files / Levels =========
  const LEVELS = [
    { key:"1",     name:"Puzzle 1",     img:ASSETS+"puzzle1.jpg",     bg:ASSETS+"bglevel1.webm", audio:ASSETS+"audio1.mp3", pieces: 9  },
    { key:"2",     name:"Puzzle 2",     img:ASSETS+"puzzle2.jpg",     bg:ASSETS+"bglevel2.webm", audio:ASSETS+"audio2.mp3", pieces: 16 },
    { key:"3",     name:"Puzzle 3",     img:ASSETS+"puzzle3.jpg",     bg:ASSETS+"bglevel3.webm", audio:ASSETS+"audio3.mp3", pieces: 25 },
    { key:"4",     name:"Puzzle 4",     img:ASSETS+"puzzle4.jpg",     bg:ASSETS+"bglevel4.webm", audio:ASSETS+"audio4.mp3", pieces: 36 },
    { key:"5",     name:"Puzzle 5",     img:ASSETS+"puzzle5.jpg",     bg:ASSETS+"bglevel5.webm", audio:ASSETS+"audio5.mp3", pieces: 49 },
    { key:"bonus", name:"Puzzle Bonus", img:ASSETS+"puzzlebonus.jpg", bg:ASSETS+"bgmenu.webm", audio:ASSETS+"audio6.mp3", pieces: 64 },
  ];

  const MENU_BG = ASSETS + "bgmenu.webm";
  const MENU_AUDIO = ASSETS + "audiomenu.mp3";

  const INTRO_VIDEO = ASSETS + "introdisturbinggames.webm";
  const INTRO_MOBILE_IMG = ASSETS + "disturbinggames_frameintroV.jpg";

  function postVideoForLevel(idx){
    // idx es levelIndex (0-based). postlevel1 para puzzle1, ... postlevel6 para bonus
    return ASSETS + "postlevel" + String(idx + 1) + ".webm";
  }
  const SFX_SUCCESS = ASSETS + "exitosound01.mp3";

  const COMPLETE_IMG = ASSETS + "complete.png";
  const COMPLETE_FINAL_IMG = ASSETS + "completefinal.png";

  // ========= DOM =========
  const $ = (id) => document.getElementById(id);

  const screenMenu = $("screenMenu");
  const screenHow  = $("screenHow");
  const screenGame = $("screenGame");

  const windows = $("windows");
  const stage = $("stage");
  const board = $("board");

  const bgVideo = $("bgVideo");
  const bgAudio = $("bgAudio");
  const sfxSuccess = $("sfxSuccess");

  const introOverlay = $("introOverlay");
  const introVideo = $("introVideo");
  const introImg = $("introImg");
  const startGate = $("startGate");
  const startBtn = $("startBtn");

  const postOverlay = $("postOverlay");
  const postVideo = $("postVideo");
  const postGate = $("postGate");
  const postBtn = $("postBtn");

  // ========= Safe play helper =========
  function tryPlay(media){
    if (!media) return Promise.resolve();
    const p = media.play();
    if (p && typeof p.catch === "function") return p.catch(() => {});
    return Promise.resolve();
  }

  // ========= Global audio handling =========
  let audioEnabled = true;
  let lastBgVolume = 0.65;

  // progreso
  let gameCompletedAll = false;

  function setBackground(src, freeze=false){
    const cur = bgVideo.dataset.src || "";
    const mode = freeze ? "freeze" : "motion";
    if (cur === src && bgVideo.dataset.mode === mode){
      if (!freeze) tryPlay(bgVideo);
      else bgVideo.pause();
      return;
    }
    bgVideo.dataset.src = src;
    bgVideo.dataset.mode = mode;
    bgVideo.pause();
    bgVideo.removeAttribute("src");
    bgVideo.innerHTML = "";
    const source = document.createElement("source");
    source.src = src;
    source.type = "video/webm";
    bgVideo.appendChild(source);
    bgVideo.loop = !freeze;
    bgVideo.load();

    if (freeze){
      const freezeFirstFrame = () => {
        try {
          bgVideo.pause();
          if (Number.isFinite(bgVideo.duration) && bgVideo.duration > 0.08) bgVideo.currentTime = 0.05;
        } catch(e) {}
      };
      bgVideo.addEventListener("loadeddata", freezeFirstFrame, {once:true});
      bgVideo.addEventListener("seeked", () => { try{ bgVideo.pause(); }catch(e){} }, {once:true});
    } else {
      bgVideo.addEventListener("canplay", () => { tryPlay(bgVideo); }, {once:true});
      tryPlay(bgVideo);
    }
  }

  function setAudio(src){
    const cur = bgAudio.dataset.src || "";
    if (cur === src){
      bgAudio.muted = !audioEnabled;
      bgAudio.volume = Math.max(0, Math.min(1, lastBgVolume));
      if (audioEnabled) tryPlay(bgAudio);
      return;
    }
    bgAudio.dataset.src = src;
    bgAudio.pause();
    bgAudio.src = src;
    bgAudio.load();
    bgAudio.loop = true;
    bgAudio.volume = Math.max(0, Math.min(1, lastBgVolume));
    bgAudio.muted = !audioEnabled;
    if (audioEnabled) tryPlay(bgAudio);
  }

  function muteBgMusic(){
    lastBgVolume = bgAudio.volume || lastBgVolume;
    bgAudio.volume = 0;
    bgAudio.muted = true;
  }
  function unmuteBgMusic(){
    bgAudio.muted = !audioEnabled;
    bgAudio.volume = Math.max(0, Math.min(1, lastBgVolume));
    if (audioEnabled) tryPlay(bgAudio);
  }

  function toggleAudio(statusEl, btnEl){
    audioEnabled = !audioEnabled;
    bgAudio.muted = !audioEnabled;
    if (!audioEnabled){
      bgAudio.pause();
      if (btnEl) btnEl.textContent = "AUDIO: OFF";
      if (statusEl) statusEl.textContent = "Silenciado";
    } else {
      if (btnEl) btnEl.textContent = "AUDIO: ON";
      tryPlay(bgAudio);
      if (statusEl) statusEl.textContent = "Reproduciendo";
    }
  }

  // ========= Screen management =========
  function showScreen(which){
    screenMenu.classList.toggle("on", which === "menu");
    screenHow.classList.toggle("on", which === "how");
    screenGame.classList.toggle("on", which === "game");

    const inGame = (which === "game");
    document.body.classList.toggle("playing", inGame);
    stage.style.display = inGame ? "block" : "none";
    windows.style.display = "block";
  }

  // ========= Draggable windows =========
  let winZ = 10;
  function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }

  function makeWindow({ id, title, contentHTML, x=40, y=40, w=360, closable=true, onClose=null, draggable=true, showHeader=true }){
    const el = document.createElement("div");
    el.className = "window";
    el.dataset.winId = id;
    el.style.left = x + "px";
    el.style.top  = y + "px";
    el.style.width = w + "px";
    el.style.zIndex = String(++winZ);

    let header = null;

    if (showHeader){
      header = document.createElement("div");
      header.className = "windowHeader";
      const t = document.createElement("div");
      t.className = "windowTitle";
      t.textContent = title || "";
      header.appendChild(t);

      if (closable){
        const xbtn = document.createElement("button");
        xbtn.className = "closeBtn";
        xbtn.type = "button";
        xbtn.textContent = "✕";
        xbtn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          el.style.display = "none";
          if (typeof onClose === "function") onClose();
        });
        header.appendChild(xbtn);
      } else {
        const sp = document.createElement("div");
        sp.style.width = "28px";
        sp.style.height = "28px";
        header.appendChild(sp);
      }

      header.style.cursor = draggable ? "grab" : "default";
      el.appendChild(header);
    }

    const body = document.createElement("div");
    body.className = "windowBody";
    body.innerHTML = contentHTML;
    el.appendChild(body);

    el.addEventListener("pointerdown", () => { el.style.zIndex = String(++winZ); });

    if (header && draggable){
      let dragging = false, startPX=0, startPY=0, startX=0, startY=0;

      header.addEventListener("pointerdown", (ev) => {
        if (ev.target && ev.target.classList && ev.target.classList.contains("closeBtn")) return;
        dragging = true;
        header.setPointerCapture(ev.pointerId);
        el.style.zIndex = String(++winZ);
        startPX = ev.clientX; startPY = ev.clientY;
        startX = parseFloat(el.style.left) || 0;
        startY = parseFloat(el.style.top) || 0;
      });

      header.addEventListener("pointermove", (ev) => {
        if (!dragging) return;
        const dx = ev.clientX - startPX;
        const dy = ev.clientY - startPY;

        const vw = window.innerWidth;
        const vh = window.innerHeight;

        const rect = el.getBoundingClientRect();
        const newX = clamp(startX + dx, 8 - rect.width + 60, vw - 8 - 60);
        const newY = clamp(startY + dy, 8, vh - 8 - 60);

        el.style.left = newX + "px";
        el.style.top  = newY + "px";
      });

      const endDrag = () => { dragging = false; };
      header.addEventListener("pointerup", endDrag);
      header.addEventListener("pointercancel", endDrag);
    }

    windows.appendChild(el);
    return el;
  }

  function removeAllWindows(){ windows.innerHTML = ""; }
  function getWindow(id){ return windows.querySelector(`.window[data-win-id="${CSS.escape(id)}"]`); }

  function showToastIn(winId, msg, kind=""){
    const w = getWindow(winId);
    if (!w) return;
    const toast = w.querySelector(".toast");
    if (!toast) return;
    toast.style.display = msg ? "block" : "none";
    toast.className = "toast" + (kind ? ` ${kind}` : "");
    toast.textContent = msg || "";
    clearTimeout(toast._t);
    if (msg){
      toast._t = setTimeout(() => { toast.style.display = "none"; }, 1600);
    }
  }

  // ========= Intro flow =========
  let introFinished = false;
  function finishIntroNow(){
    if (introFinished) return;
    introFinished = true;
    try{ introVideo.pause(); introVideo.removeAttribute("src"); introVideo.load(); }catch(e){}
    introOverlay.classList.add("hidden");
    introOverlay.setAttribute("aria-hidden","true");
    enterMenu();
  }

  async function runIntroThenMenu(){
    bgVideo.pause();
    bgAudio.pause();
    sfxSuccess.src = SFX_SUCCESS;
    sfxSuccess.load();
    introFinished = false;

    if (isMobile){
      introVideo.style.display = "none";
      introImg.style.display = "block";
      introImg.src = INTRO_MOBILE_IMG;
      introImg.className = "introImgZoom";
      await new Promise(r => setTimeout(r, 1200));
      finishIntroNow();
      return;
    }

    introImg.style.display = "none";
    introVideo.style.display = "block";
    introVideo.controls = false;
    introVideo.muted = false;
    introVideo.playsInline = true;
    introVideo.src = INTRO_VIDEO;
    introVideo.load();

    await tryPlay(introVideo);
    if (introVideo.paused) startGate.classList.add("on");

    startBtn.onclick = async (ev) => {
      ev.stopPropagation();
      startGate.classList.remove("on");
      await tryPlay(introVideo);
    };

    // v2.1: ONLY the intro can be skipped. Post-level videos remain mandatory.
    introOverlay.onpointerdown = (ev) => {
      if (ev.target === startBtn) return;
      finishIntroNow();
    };
    introVideo.onended = finishIntroNow;
  }

  function enterMenu(){
    showScreen("menu");
    buildMenu(); // also sets bgmenu+audio
  }

  // ========= Menu / Submenus (always bgmenu + audiomenu) =========
  function ensureMenuAmbience(){
    setBackground(MENU_BG);
    setAudio(MENU_AUDIO);
  }

  function buildMenu(){
    removeAllWindows();
    stage.style.display = "none";
    ensureMenuAmbience();

    const w = Math.min(680, window.innerWidth - 36);
    const x = Math.round((window.innerWidth - w)/2);
    const y = Math.round((window.innerHeight - 360)/2);

    const menuWin = makeWindow({
      id: "menu",
      title: "",
      x, y, w,
      closable: false,
      draggable: false,
      showHeader: false,
      contentHTML: `
        <div style="display:flex; justify-content:center; margin: 4px 0 10px;">
          <img src="${ASSETS}logo.png" alt="DARK LIMITS" style="width:min(500px, 74vw); height:auto; display:block;" />
        </div>

        <div class="menuTextBig">Completa los puzzles,<br>
          avanza a través de los 5 niveles<br>
          y descubre qué pasó<br>
          el fatídico 9 de noviembre de 2020...</div>

        <div style="height:12px"></div>

        <div class="btns" style="justify-content:center;">
          <button class="primary" id="menuPlay">JUGAR</button>
          <button id="menuContinue" style="display:none;">CONTINUAR</button>
          <button id="menuRestart" style="display:none;">REINICIAR</button>
          <button id="menuFinalVideo" style="display:none; border-color: rgba(255,60,60,0.9); background: rgba(255,60,60,0.22);">VER VIDEO FINAL</button>
          <button id="menuHow">CÓMO JUGAR</button>
          <button id="menuClassified">ARCHIVO CLASIFICADO</button>
          <a class="btnlink" href="https://www.disturbingstories.com/dark-limits-prelude.html" target="_blank" rel="noopener">Descubre DARK LIMITS</a>
        </div>

        
        <div class="audioRow" style="justify-content:center; margin-top:18px;">
          <button id="menuAudioToggle">AUDIO: ON</button>
          <label for="menuAudioVol">Vol</label>
          <input id="menuAudioVol" type="range" min="0" max="1" step="0.01" value="0.65" />
        </div>

        <div class="menuFooter" style="margin-top:14px; padding-top:12px;">
          © Disturbing Stories 2026 / Vianda Visual /
          <a class="pillLink" href="https://www.disturbingstories.com" target="_blank" rel="noopener">www.disturbingstories.com</a>
        </div>
      `
    });

    // Centrar la caja exactamente (horizontal y vertical)
    if (menuWin){
      const rect = menuWin.getBoundingClientRect();
      const nx = Math.round((window.innerWidth - rect.width)/2);
      const ny = Math.round((window.innerHeight - rect.height)/2);
      menuWin.style.left = Math.max(12, nx) + "px";
      menuWin.style.top = Math.max(12, ny - 40) + "px";
    }

    document.getElementById("menuPlay").addEventListener("click", () => {
      showScreen("game");
      buildGameWindows();
      emitToHost("GAME_STARTED",{});
      loadLevel(0);
    });
    // Estado del menú según progreso

  function piecesToGrid(n){

  function generateEdges(){
    const edges = Array.from({length: ROWS}, () =>
      Array.from({length: COLS}, () => ({t:0,r:0,b:0,l:0}))
    );
    for (let r=0; r<ROWS; r++){
      for (let c=0; c<COLS; c++){
        const e = edges[r][c];
        e.t = (r === 0) ? 0 : -edges[r-1][c].b;
        e.l = (c === 0) ? 0 : -edges[r][c-1].r;
        e.b = (r === ROWS-1) ? 0 : (Math.random() > 0.5 ? 1 : -1);
        e.r = (c === COLS-1) ? 0 : (Math.random() > 0.5 ? 1 : -1);
      }
    }
    return edges;
  }

  function jigsawEdge(ctx, len, sign, tab, neck){
    const mid = len * 0.5;
    const tabW = tab;
    const neckW = neck;
    const x1 = mid - tabW;
    const x2 = mid - neckW;
    const x3 = mid + neckW;
    const x4 = mid + tabW;

    ctx.lineTo(x1, 0);
    if (sign === 0){ ctx.lineTo(len, 0); return; }

    const s = sign;
    ctx.lineTo(x2, 0);
    ctx.bezierCurveTo(x2, 0, x2, s * tab * 0.35, mid, s * tab * 0.35);

    ctx.bezierCurveTo(
      mid + (tabW - neckW) * 0.2, s * tab * 0.35,
      mid + (tabW - neckW) * 0.75, s * tab,
      mid, s * tab
    );
    ctx.bezierCurveTo(
      mid - (tabW - neckW) * 0.75, s * tab,
      mid - (tabW - neckW) * 0.2, s * tab * 0.35,
      mid, s * tab * 0.35
    );

    ctx.bezierCurveTo(mid, s * tab * 0.35, x3, s * tab * 0.35, x3, 0);
    ctx.lineTo(x4, 0);
    ctx.lineTo(len, 0);
  }

  function piecePath(ctx, w, h, e){
    const tab = Math.min(w, h) * TAB_SIZE;
    const neck = Math.min(w, h) * TAB_NECK;

    ctx.beginPath();
    ctx.moveTo(PAD, PAD);

    ctx.save(); ctx.translate(PAD, PAD); jigsawEdge(ctx, w, e.t, tab, neck); ctx.restore();
    ctx.save(); ctx.translate(PAD + w, PAD); ctx.rotate(Math.PI/2); jigsawEdge(ctx, h, e.r, tab, neck); ctx.restore();
    ctx.save(); ctx.translate(PAD + w, PAD + h); ctx.rotate(Math.PI); jigsawEdge(ctx, w, e.b, tab, neck); ctx.restore();
    ctx.save(); ctx.translate(PAD, PAD + h); ctx.rotate(-Math.PI/2); jigsawEdge(ctx, h, e.l, tab, neck); ctx.restore();

    ctx.closePath();
  }

  function drawPieceCanvas(r, c, edgesRC){
    const w = pieceW, h = pieceH;
    const cw = Math.ceil(w + PAD*2) + 2;
    const ch = Math.ceil(h + PAD*2) + 2;

    const canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;

    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;

    ctx.save();
    piecePath(ctx, w, h, edgesRC);
    ctx.clip();

    const imgAR = img.width / img.height;
    const boxAR = 1;
    let drawW, drawH, offX, offY;
    if (imgAR > boxAR){
      drawH = boardSizePx;
      drawW = boardSizePx * imgAR;
      offX = -(drawW - boardSizePx)/2;
      offY = 0;
    } else {
      drawW = boardSizePx;
      drawH = boardSizePx / imgAR;
      offX = 0;
      offY = -(drawH - boardSizePx)/2;
    }

    const sx = c * w;
    const sy = r * h;
    ctx.drawImage(img, offX - sx + PAD + 1, offY - sy + PAD + 1, drawW, drawH);
    ctx.restore();

    return canvas;
  }

  function trySnap(piece, updateLockedCb){
    if (piece.locked) return;
    const dx = piece.x - piece.correctX;
    const dy = piece.y - piece.correctY;

    if (Math.hypot(dx,dy) <= SNAP_TOL){
      piece.locked = true;
      piece.x = piece.correctX;
      piece.y = piece.correctY;
      piece.el.style.left = `${piece.x}px`;
      piece.el.style.top  = `${piece.y}px`;
      piece.el.classList.add("locked");
      piece.el.style.zIndex = "10";

      lockedCount++;
      updateLockedCb(String(lockedCount));

      if (lockedCount === TOTAL){
        stopTimer();

      } else if (lockedCount % Math.max(3, Math.floor(TOTAL/6)) === 0){
        showToastIn("controls", `¡Bien! ${lockedCount}/${TOTAL}`);

    }
  }

  function attachDrag(piece, updateTimeCb, updateLockedCb){
    const el = piece.el;
    let dragging = false, startPX = 0, startPY = 0, startX = 0, startY = 0;

    el.addEventListener("pointerdown", (ev) => {
      if (piece.locked) return;
      ev.preventDefault();
      startTimer(updateTimeCb);
      dragging = true;
      el.setPointerCapture(ev.pointerId);
      el.style.zIndex = String(++zTop);

      startPX = ev.clientX; startPY = ev.clientY;
      startX = piece.x; startY = piece.y;
    });

    el.addEventListener("pointermove", (ev) => {
      if (!dragging || piece.locked) return;
      const dx = ev.clientX - startPX;
      const dy = ev.clientY - startPY;

      const area = getPlayArea();
      const vh = window.innerHeight;
      const minX = area.left - PAD + 4;
      const maxX = window.innerWidth - piece.w + PAD - 4;
      piece.x = clamp(startX + dx, minX, maxX);
      piece.y = clamp(startY + dy, -piece.h + 30, vh - 30);

      el.style.left = `${piece.x}px`;
      el.style.top  = `${piece.y}px`;
    });

    const up = () => {
      if (!dragging) return;
      dragging = false;
      trySnap(piece, updateLockedCb);
    };
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  }

  function shufflePieces(){
    const area = getPlayArea();

      p.el.style.zIndex = String(++zTop);

  }

  async function playPostLevelThenContinue(){
    // Mandatory post video (fullscreen). Mute bg music during.
    muteBgMusic();

    postOverlay.classList.add("on");
    postVideo.controls = false;
    postVideo.muted = false;
    postVideo.playsInline = true;
    postVideo.src = postVideoForLevel(levelIndex);
    postVideo.load();

    const postErrorPromise = new Promise((resolve) => {
      postVideo.onerror = () => resolve("error");
      postVideo.onabort = () => resolve("abort");
    });

    // Prevent interactions
    stage.classList.add("disabled");
    windows.style.pointerEvents = "none";
    // Autoplay fallback (sin reutilizar la intro)
    if (postGate) postGate.classList.remove("on");
    await tryPlay(postVideo);
    if (postVideo.paused){
      if (postGate) postGate.classList.add("on");
      if (postBtn){
        postBtn.onclick = async () => {
          if (postGate) postGate.classList.remove("on");
          await tryPlay(postVideo);
        };
      }
    } else {
      if (postGate) postGate.classList.remove("on");
    }

    const postEndPromise = new Promise((resolve) => { postVideo.onended = () => resolve("ended"); });
    await Promise.race([postEndPromise, postErrorPromise]);

    // Continue flow
    if (levelIndex < LEVELS.length - 1){
      // Cargar siguiente nivel SIN quitar el overlay para evitar ver el tablero anterior
      await loadLevel(levelIndex + 1);
      if (levelIndex === LEVELS.length - 1){
        showBonusHint();
      }
      if (postGate) postGate.classList.remove("on");
      postOverlay.classList.remove("on");
      postVideo.pause();
      postVideo.src = "";

      // Restore interactions
      windows.style.pointerEvents = "";
      stage.classList.remove("disabled");

      unmuteBgMusic();
      return;
    } else {
      // Último nivel: volver al menú directamente
      gameCompletedAll = true;
      emitToHost("GAME_COMPLETED",{});
      if (postGate) postGate.classList.remove("on");
      postOverlay.classList.remove("on");
      postVideo.pause();
      postVideo.src = "";

      windows.style.pointerEvents = "";
      stage.classList.remove("disabled");

      unmuteBgMusic();
      showScreen("menu");
      buildMenu();
      return;
    }
  }

  async function playFinalVideoFromMenu(){
    muteBgMusic();

    postOverlay.classList.add("on");
    postVideo.controls = false;
    postVideo.muted = false;
    postVideo.playsInline = true;
    postVideo.src = postVideoForLevel(LEVELS.length - 1);
    postVideo.load();

    const postErrorPromise = new Promise((resolve) => {
      postVideo.onerror = () => resolve("error");
      postVideo.onabort = () => resolve("abort");
    });

    windows.style.pointerEvents = "none";
    stage.classList.add("disabled");
    // Autoplay fallback (sin reutilizar la intro)
    if (postGate) postGate.classList.remove("on");
    await tryPlay(postVideo);
    if (postVideo.paused){
      if (postGate) postGate.classList.add("on");
      if (postBtn){
        postBtn.onclick = async () => {
          if (postGate) postGate.classList.remove("on");
          await tryPlay(postVideo);
        };
      }
    } else {
      if (postGate) postGate.classList.remove("on");
    }

    const postEndPromise = new Promise((resolve) => { postVideo.onended = () => resolve("ended"); });
    await Promise.race([postEndPromise, postErrorPromise]);

    if (postGate) postGate.classList.remove("on");

    postOverlay.classList.remove("on");
    postVideo.pause();
    postVideo.src = "";

    windows.style.pointerEvents = "";
    stage.classList.remove("disabled");

    gameCompletedAll = true;
    unmuteBgMusic();
    showScreen("menu");
    buildMenu();
  }


  function onLevelCompleted(){
    playSuccessSfx();

    stage.classList.add("celebrate","disabled");
    const fx = document.getElementById("fxFlash");
    if (fx){
      fx.style.animation = "none";
      fx.offsetHeight;
      fx.style.animation = "flashPop 2s ease-in-out both";
    }
    setTimeout(() => {
      stage.classList.remove("celebrate","disabled");
      showCompletionOverlay();
    }, 2000);
  }

  // ========= Level flow =========
  function createPieces(updateTimeCb, updateLockedCb){
    pieces = [];
    lockedCount = 0;

    const edges = generateEdges();
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    for (let r=0; r<ROWS; r++){
      for (let c=0; c<COLS; c++){
        const el = document.createElement("div");
        el.className = "piece";
        el.style.zIndex = String(++zTop);

        const canvas = drawPieceCanvas(r, c, edges[r][c]);
        el.appendChild(canvas);

        const correctX = boardX + c * pieceW - PAD;
        const correctY = boardY + r * pieceH - PAD;

        const pw = canvas.width;
        const ph = canvas.height;

        let startX, startY;
        const area = getPlayArea();
        const minX = area.left - PAD + 6;
        const maxX = Math.max(minX, vw - pw + PAD - 6);
        const minY = 10;
        const maxY = Math.max(minY, vh - ph - 10);
        const region = Math.floor(Math.random()*4);
        if (region === 0 && boardX - pw - 14 > minX){
          startX = rand(minX, boardX - pw - 14); startY = rand(minY,maxY);
        } else if (region === 1 && boardX + boardSizePx + 14 < maxX){
          startX = rand(boardX + boardSizePx + 14, maxX); startY = rand(minY,maxY);
        } else if (region === 2 && boardY - ph - 12 > minY){
          startX = rand(minX,maxX); startY = rand(minY, boardY - ph - 12);
        } else if (boardY + boardSizePx + 12 < maxY){
          startX = rand(minX,maxX); startY = rand(boardY + boardSizePx + 12, maxY);
        } else {
          startX = rand(minX,maxX); startY = rand(minY,maxY);
        }

        el.style.left = `${startX}px`;
        el.style.top  = `${startY}px`;

        const piece = { r, c, el, locked:false, correctX, correctY, x:startX, y:startY, w:pw, h:ph };
        attachDrag(piece, updateTimeCb, updateLockedCb);
        pieces.push(piece);
        stage.appendChild(el);
      }
    }
  }

  function loadLevel(index){
    return new Promise((resolve) => {
      levelIndex = index;
      const L = LEVELS[levelIndex];

      const uiTitle = controlRefs.uiTitle;
      const uiDesc  = controlRefs.uiDesc;
      const statPieces = controlRefs.statPieces;
      const statLocked = controlRefs.statLocked;
      const statTime = controlRefs.statTime;

      showToastIn("controls", "", "");
      statLocked.textContent = "0";

      const grid = piecesToGrid(L.pieces);
      COLS = grid.cols;
      ROWS = grid.rows;
      TOTAL = L.pieces;

      uiTitle.textContent = L.name;
      uiDesc.textContent = `${TOTAL} piezas (${COLS}×${ROWS})`;
      statPieces.textContent = String(TOTAL);
      resetTimerUI((t) => { statTime.textContent = t; });

      // Hide stage during asset swap to avoid flicker
      stage.style.visibility = "hidden";

      // bg + audio per level
      setBackground(L.bg, true);
      bgAudio.volume = Number(controlRefs.audioVol.value);
      lastBgVolume = bgAudio.volume;
      setAudio(L.audio);
      if (controlRefs.audioStatus) controlRefs.audioStatus.textContent = audioEnabled ? "Reproduciendo" : "Silenciado";

      img = new Image();
      img.decoding = "async";
      img.src = L.img;

      img.onload = () => {
        clearGameState();
        layoutBoard();

        const updateTimeCb = (t) => { statTime.textContent = t; };
        const updateLockedCb = (v) => { statLocked.textContent = v; };

        createPieces(updateTimeCb, updateLockedCb);
        stage.style.visibility = "visible";
        showToastIn("controls", "Listo");
        resolve();
      };

      img.onerror = () => {
        clearGameState();
        stage.style.visibility = "visible";
        showToastIn("controls", "No se pudo cargar la imagen (revisa assets/)", "warn");
        resolve();
      };
    });
  }

  // Resize: keep board + locked pieces aligned
  let resizeT = null;
  window.addEventListener("resize", () => {
    if (stage.style.display !== "block") return;
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      document.documentElement.style.setProperty("--dockW", getControlDockWidth() + "px");
      layoutBoard();
      for (const p of pieces){
        p.correctX = boardX + p.c * pieceW - PAD;
        p.correctY = boardY + p.r * pieceH - PAD;
        if (p.locked){
          p.x = p.correctX;
          p.y = p.correctY;
          p.el.style.left = `${p.x}px`;
          p.el.style.top  = `${p.y}px`;
        }
      }
    }, 120);
  });

  // ========= INIT =========
  // ========= PRE-START (v2.1) =========
const preStartOverlay = $("preStartOverlay");
const preStartBtn = $("preStartBtn");
const mobileBlock = $("mobileBlock");

function lockToDesktopOnly(){
  // Hide everything else and show the desktop-only image
  try{ introOverlay.classList.add("hidden"); introOverlay.setAttribute("aria-hidden","true"); }catch(e){}
  try{ postOverlay.classList.remove("on"); postOverlay.setAttribute("aria-hidden","true"); }catch(e){}
  try{ bgVideo.pause(); }catch(e){}
  try{ bgAudio.pause(); }catch(e){}
  try{ stage.style.display = "none"; }catch(e){}
  try{ windows.style.display = "none"; }catch(e){}
  if (preStartOverlay) preStartOverlay.classList.add("hidden");
  if (mobileBlock){
    mobileBlock.classList.remove("hidden");
    mobileBlock.setAttribute("aria-hidden","false");
  }
}

async function startAfterGate(){
  if (isMobile){
    lockToDesktopOnly();
    return;
  }
  // Show intro + run normal flow
  if (preStartOverlay){
    preStartOverlay.classList.add("hidden");
    preStartOverlay.setAttribute("aria-hidden","true");
  }
  introOverlay.classList.remove("hidden");
  introOverlay.setAttribute("aria-hidden","false");
  await runIntroThenMenu();
}

if (preStartBtn){
  preStartBtn.addEventListener("click", () => { startAfterGate(); }, { once:true });
}
})();
</script>
